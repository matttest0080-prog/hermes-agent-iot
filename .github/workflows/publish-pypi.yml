name: Publish hermes-agent-iot to PyPI

"on":
  push:
    tags:
      - "iot-v*"
  # Exercise the same PM exports/build/clean-install job before creating a tag.
  # PR builds cannot publish or request an OIDC token.
  pull_request:
    branches: [pi2-lite]
    paths:
      - '.github/workflows/publish-pypi.yml'
      - '.github/actions/setup-pm/**'
      - 'scripts/ci/**'
      - 'scripts/sanitize_release_wheel.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'README.md'
      - 'hermes_cli/resources/profiles/**'
      - 'tests/test_*packaging*.py'
      - 'tests/test_publish_pypi_workflow.py'
      - 'tests/ci/test_*smoke*.py'

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'matttest0080-prog/hermes-agent-iot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify tag ancestry
        if: github.event_name == 'push'
        env:
          TAGGED_SHA: ${{ github.sha }}
        run: |
          git fetch --no-tags origin \
            +refs/heads/pi2-lite:refs/remotes/origin/pi2-lite
          bash scripts/check_release_ancestry.sh \
            "$TAGGED_SHA" refs/remotes/origin/pi2-lite
      - name: Set up locked release test environment through PM
        id: pm
        uses: ./.github/actions/setup-pm
        with:
          # Linux Git is supplied by the runner (ancestry gate already used it).
          # PM pins Git for Windows only; requesting it here fails before tests.
          packages: ripgrep
          extras: '["full", "rag"]'
          test-environment: 'true'
      - name: Run release-focused tests
        run: >-
          scripts/run_tests.sh
          tests/test_iot_packaging_profiles.py
          tests/test_packaging_build_guard.py
          tests/test_packaging_metadata.py
          tests/test_project_metadata.py
          tests/test_publish_pypi_workflow.py
          tests/test_sanitize_release_wheel.py
          tests/test_pi2_install_guards.py
          tests/test_termux_all_extra_compat.py
          tests/agent/test_bedrock_integration.py
          tests/ci/test_release_wheel_smoke.py
          tests/ci/test_publish_pm_bootstrap.py
      - name: Validate tag, distribution name, and version
        id: release
        env:
          TAG: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          "$HERMES_PYTHON" - <<'PY'
          import os, tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "hermes-agent-iot", project["name"]
          expected_tag = f"iot-v{project['version']}"
          if os.environ["EVENT_NAME"] == "push":
              assert os.environ["TAG"] == expected_tag, (os.environ["TAG"], project["version"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tag={expected_tag}\n")
          PY
      - name: Install release build tools through PM
        run: python -m scripts.ci.python_packages build==1.6.0 twine==6.2.0
      - name: Build and check artifacts
        env:
          HERMES_IOT_RELEASE_BUILD: "1"
        run: |
          "$HERMES_PYTHON" -m build --wheel
          "$HERMES_PYTHON" scripts/sanitize_release_wheel.py dist/*.whl
          "$HERMES_PYTHON" -m twine check --strict dist/*
      - name: Clean wheel smoke test
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: >-
          "$HERMES_PYTHON" scripts/ci/smoke_release_wheel.py
          dist/*.whl --tag "$TAG" --receipt dist/smoke-receipt.json
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: hermes-agent-iot-dist
          path: dist/*.whl
          if-no-files-found: error

  publish:
    if: github.repository == 'matttest0080-prog/hermes-agent-iot' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/iot-v')
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: hermes-agent-iot-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist/
