overrides:
  # IoT fork: GHSA-g3hv-75wg-m249 / CVE-2026-118764 (minimatch globparts amplification) is
  # fixed in upstream 11.0.1 and still open in every release below it. 11.0.1 dropped `makeRe`,
  # which old consumers here call, so the fork vendors the 10.x runtime with upstream 11.0.1's
  # two bounds backported. One target for the whole `<11` band mirrors what the fork did before
  # the pnpm migration (every consumer below 11 got the same 10.x-based compat): a real 9.x copy
  # cannot coexist with the tree-wide brace-expansion 5.0.12 pin, because 9.x calls the module'
  # default export, which 5.x does not provide.
  # Every v0.23.1 consumer of the affected band resolves to the vendored copy.
  'minimatch@<11': link:vendor/minimatch-compat-10.2.6
  # 11.0.1 is the first release that fixes the advisory; keep the >=11 band there.
  'minimatch@>=11': 11.0.1
  '@electron/osx-sign>isbinaryfile': 5.0.7
  lodash: 4.18.1
  yauzl: '^3.3.1'
  protobufjs: '^8.7.1'
  axios: 1.20.0
  brace-expansion: 5.0.12
  mermaid: 11.16.1
  dompurify: 3.4.17
